version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: email_scheduler_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: email_scheduler
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: email_scheduler_redis
    ports:
      - "6379:6379"
    # Enable AOF persistence: Redis writes every command to disk.
    # This means BullMQ delayed jobs and rate-limit counters survive redis restarts.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
